name: Run Go tests
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: vet
      run: go vet ./...
    - name: test
      run: go test -v -short -count=1 ./...
    - name: race
      run: go test -race -short -count=1 ./...
